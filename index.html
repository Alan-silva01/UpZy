        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      }
      
      .glass-card-active {

      /* Hide scrollbar */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none; 
        scrollbar-width: none; 
      }
      
      /* Custom thin scrollbar for inner content */
      .thin-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .thin-scrollbar::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.02);
        border-radius: 4px;
      }
      .thin-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.1);
        border-radius: 4px;
      }
      .thin-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(255,255,255,0.2);
      }

      /* Fix Recharts focus behavior */
      .recharts-sector {
        outline: none;
      }
      .recharts-surface {
        outline: none;
      }

      /* Safe area para iOS PWA - ajusta o padding-top global */
      :root {
        --header-height: calc(88px + env(safe-area-inset-top, 0px));
      }

      /* Classe customizada para padding-top com safe area */
      .pt-header {
        padding-top: var(--header-height);
      }

      /* Loading Skeleton Inline - renderiza instantaneamente */
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #09090b;
        z-index: 9999;
        transition: opacity 0.2s ease-out;
      }

      #app-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loader-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(16, 185, 129, 0.15);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        will-change: transform;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Optimize rendering */
      * {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Prevent layout shifts */
      img, svg {
        max-width: 100%;
        height: auto;
      }

      /* Fix iOS keyboard/input issues in PWA */
      input, textarea, select {
        font-size: 16px !important; /* Prevents iOS zoom on focus */
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
      }

      /* Ensure inputs are not covered by keyboard */
      @supports (-webkit-touch-callout: none) {
        input:focus, textarea:focus, select:focus {
          font-size: 16px !important;
        }
      }

      /* Animações de transição de página */
      @keyframes slideInFromRight {
        0% {
          opacity: 0;
          transform: translateX(20px);
        }
        100% {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes slideInFromLeft {
        0% {
          opacity: 0;
          transform: translateX(-20px);
        }
        100% {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .animate-slide-up {
        animation: slideInFromRight 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }

      .animate-slide-in-left {
        animation: slideInFromLeft 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }

      .animate-slide-in-right {

    <script>
      // Otimizado: Remove loader mais rápido
      const removeLoader = () => {
        const loader = document.getElementById('app-loader');
        if (loader) {
          loader.classList.add('hidden');
          setTimeout(() => loader.remove(), 200);
        }
      };

      // Remove quando o DOM estiver pronto (mais rápido que 'load')
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', removeLoader);
      } else {
        removeLoader();
      }

      // Fallback: remove após 3 segundos
      setTimeout(removeLoader, 3000);
    </script>
